# Configuración de ejemplo (versionada, SIN secretos).
# Para personalizar: copie las secciones que quiera cambiar a config/local.toml (no versionado).
# Las credenciales van en variables de entorno o en .env (ver .env.example), nunca aquí.

[app]
modo = "real"                 # "real" | "demo" (demo = datos SINTÉTICOS etiquetados, solo para pruebas)
host = "127.0.0.1"            # solo escucha en la máquina local
puerto = 8765
moneda_base = "MXN"
indice_referencia = "SIC:IVV" # comparación de la cartera: S&P 500 (IVV) convertido a MXN
actualizacion_automatica = true   # el motor consulta fuentes, recalcula propuestas y evalúa alertas en segundo plano

[referencias]
# Carteras de comparación del seguimiento. El S&P/BMV IPC no tiene fuente gratuita: se usa ACTIVAR,
# fondo de Actinver que replica el índice de la BMV (NAV importado o EODHD). 60/40 = 60 % IPC + 40 % deuda gubernamental.
ipc = "FONDO:ACTIVAR"
sp500 = "SIC:IVV"
deuda = "FONDO:ACTIGOB"
pesos_60_40 = [0.60, 0.40]

[programacion]
# Motor automático: en horario de mercado revisa cada `revisar_cada_min`; fuera de horario cada `fuera_horario_min`.
revisar_cada_min = 15
fuera_horario_min = 60

[tiempo_real]
# Flujo en vivo de Alpaca (WebSocket IEX, plan gratuito: 1 conexión, 30 símbolos). Solo emisoras de EE. UU. (SIC/ETF);
# precio en MXN = precio en vivo × tipo de cambio más reciente (Banxico FIX o FRED). La BMV local sigue con cierres.
activo = true
feed = "iex"
max_simbolos = 30
guardar_cada_seg = 15                # cada cuánto se escriben en la base los últimos precios
recalcular_cada_min = 5              # recalcula propuestas y alertas con precios nuevos al menos cada 5 min…
umbral_movimiento = 0.01             # …o antes, si algún símbolo se mueve ≥ 1 % desde el último cálculo
recalculo_minimo_seg = 120           # nunca dos cálculos en vivo con menos de 2 min de diferencia

[investigacion]
horizontes = [1, 5]                  # H: próxima sesión y próximos cinco días hábiles
# L (ventana retrospectiva máxima) = 60 sesiones (terminal/investigacion/datos.py); proporciones 70/15/15, embargo = H

[disponibilidad]
# Horas tras el cierre en que cada proveedor publica su dato (available_at = cierre + retraso). Conservador.
tiingo = 3
alpaca = 1
eodhd = 4
archivo = 24
fred = 72
banxico = 1

[vigencia]
# Umbrales para declarar un dato «vigente», «retrasado» o «vencido».
# cierre / nav: sesiones hábiles de atraso toleradas respecto a la última sesión cerrada.
cierre_sesiones_vigente = 0
cierre_sesiones_retrasado = 1        # más de esto => vencido
nav_sesiones_vigente = 1             # los fondos publican NAV con T+1 frecuentemente
nav_sesiones_retrasado = 3
fx_sesiones_vigente = 1
fx_sesiones_retrasado = 5            # FRED publica con varios días de rezago
retrasado_minutos_vigente = 20       # datos «retrasados» intradía
tiempo_real_segundos_vigente = 120

[proveedores.fred]
activo = true                        # tipo de cambio USD/MXN (DEXMXUS), sin clave, diario con rezago
peticiones_por_dia = 50

[proveedores.banxico]
activo = true                        # tipo de cambio FIX (SF43718); requiere BANXICO_TOKEN (gratuito)
peticiones_por_dia = 200

[proveedores.tiingo]
activo = true                        # cierres EOD de EE. UU. (referencia SIC y ETF); requiere TIINGO_API_KEY
peticiones_por_hora = 45
peticiones_por_dia = 900

[proveedores.eodhd]
activo = true                        # cierres EOD de la BMV (.MX); requiere EODHD_API_KEY
peticiones_por_dia = 18              # plan gratuito: 20/día; se deja margen

[proveedores.alpaca]
activo = true                        # barras diarias EE. UU. (solo datos); requiere ALPACA_API_KEY_ID y ALPACA_API_SECRET_KEY
feed_historico = "sip"               # plan gratuito: SIP con 15 min de retraso; si la cuenta no lo permite se usa IEX
peticiones_por_dia = 5000            # el plan gratuito permite 200 peticiones/min

[proveedores.barchart]
activo = true                        # históricos EE. UU. vía Barchart OnDemand; requiere BARCHART_API_KEY (contrato)
peticiones_por_dia = 400

[proveedores.archivo]
activo = true                        # precios / valor liquidativo importados por el usuario (CSV)

[proveedores.forexfactory]
activo = true                        # calendario macro (feed de exportación); sin clave
peticiones_por_hora = 2

[proveedores.seekingalpha_rss]
activo = true                        # titulares por emisora (RSS público); sin clave
peticiones_por_hora = 60

[proveedores.sec_edgar]
activo = true                        # Formulario 4; requiere SEC_USER_AGENT (nombre + correo de contacto)
peticiones_por_dia = 1000

[alertas]
deriva_pp = 5.0                      # disparo: alguna posición se aleja ≥ 5 pp del objetivo…
deriva_rearme_pp = 3.0               # …y se rearma solo cuando vuelve a < 3 pp (histéresis)
mejora_neta_min = 0.005              # …y la mejora esperada neta de costos supera 0.5 % en el horizonte
stop_loss = -0.08                    # caída vs costo promedio
take_profit = 0.15                   # ganancia vs costo promedio
caida_desde_maximo = -0.10           # caída desde el máximo desde la compra
macro_horas = 24                     # evento de alto impacto USD/MXN en las próximas 24 h
insider_valor_min_usd = 250000       # compras/ventas de insiders relevantes
noticia_sentimiento_min = 1.0        # |sentimiento| mínimo para alerta de noticia de alto impacto
cambio_brusco_pct = 0.05             # |cambio| entre los dos últimos precios de una posición
concentracion_aviso = 0.45           # aviso desde 45 %; crítica sobre el tope del Reto (50 %)
perdida_maxima = -0.10               # pérdida máxima que usted acepta frente al capital de la etapa
diferencia_portal_pct = 0.01         # diferencia entre la estimación y el saldo capturado del portal
evento_corporativo_dias = 10
deterioro_razon = 1.10               # error de pronósticos resueltos > 1.10× «sin cambio» ⇒ deterioro
exigir_precio_confiable = true       # sin precio BMV confiable o con noticias contradictorias: se inhiben alertas direccionales
enfriamiento_horas = 6               # no repetir la misma alerta antes de 6 h
silenciar_fuera_de_horario = true    # fuera del horario de la BMV se registra pero no se notifica al escritorio
notificar_escritorio = true
notificar_correo = true              # solo envía si SMTP_HOST y ALERTAS_CORREO_DESTINO están en .env
resumen_matutino = true             # plan del día por Telegram cada sesión hábil de la BMV
resumen_matutino_hora = "07:00"     # hora de la Ciudad de México (la BMV abre 07:30 hasta el 2 de nov., luego 08:30)
telegram_bot = true                 # responder comandos y preguntas en el chat configurado (/plan, /boletas, /estado…)
chatbot_max_por_hora = 20           # tope de preguntas libres por hora enviadas a Claude u Ollama (costo acotado)
notificar_telegram = true            # se envía solo si TELEGRAM_BOT_TOKEN y TELEGRAM_CHAT_ID están en .env

[perfil]
# Valores iniciales; se editan desde la interfaz sin tocar código.
riesgo = "moderado"                  # conservador | moderado | agresivo
horizonte_anios = 5
capital = 250000                     # MXN
max_peso_activo = 0.12
max_exposicion_usd = 0.75
incluir_etf_por_confirmar = true     # ETF cuya disponibilidad en el SIC no se ha confirmado
excluir = []                         # ids a excluir, p. ej. ["SIC:TSLA"]
escenario = "base"                   # base | adverso | favorable (ajusta el rendimiento esperado)

[perfiles.conservador]
aversion_riesgo = 8.0
vol_objetivo = 0.10
min_deuda_mixta = 0.50
[perfiles.moderado]
aversion_riesgo = 4.0
vol_objetivo = 0.15
min_deuda_mixta = 0.25
[perfiles.agresivo]
aversion_riesgo = 1.5
vol_objetivo = 0.22
min_deuda_mixta = 0.0

[costos]
comision_pct = 0.0025                # comisión por operación (antes de IVA); ajuste a su contrato
iva = 0.16
spread_pct = { accion_sic = 0.0040, accion_bmv = 0.0020, etf = 0.0030, fibra = 0.0030, fondo = 0.0 }
impuesto_ganancia = 0.10             # ISR sobre ganancia en BMV/SIC (configurable)
impuesto_dividendo = 0.10

[optimizacion]
historia_min_sesiones = 504          # ~2 años de datos diarios por activo
ventana_estimacion = 756             # ~3 años para estimar
walk_forward_entrenamiento = 504
walk_forward_prueba = 63
banda_rebalanceo_pp = 2.0            # no sugerir cambios menores a 2 puntos de peso
monto_minimo_operacion = 2000        # MXN
max_activos = 15
l2_regularizacion = 0.001           # γ: penaliza concentración y estabiliza pesos
semilla = 42

[puntuacion]
# Pesos de cada criterio (se normalizan). Visibles y editables.
rendimiento_ajustado = 0.25
riesgo = 0.20
diversificacion = 0.15
liquidez = 0.10
costos = 0.10
calidad_datos = 0.20
