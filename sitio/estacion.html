<title>Help Quote Terminal</title>

<style>
/* Estación de mercado: monitor | gráfico | inspector. Grafito con rojo de selección; violeta discontinuo = FUTURO. */
:root {
  --fondo: #f4f4f2; --superficie: #ffffff; --elevada: #ebebe8; --texto: #111318; --texto-2: #4a505a; --borde: #d4d4d0;
  --acento: #b42626; --acento-solido: #b42626; --acento-texto: #ffffff; --positivo: #1d6b3a; --negativo: #a3261c;
  --vigente: #1d6b3a; --vigente-fondo: #e3f1e7; --vencido: #a3261c; --vencido-fondo: #f8e3e0; --sin-datos: #4a505a;
  --sin-datos-fondo: #e9e8e4; --futuro: #5a3d8a; --futuro-fondo: #ece6f6; --foco: #111318;
  --sans: "Segoe UI", system-ui, -apple-system, Roboto, "Helvetica Neue", Arial, sans-serif;
  --simbolo: ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --fondo: #090a0c; --superficie: #121419; --elevada: #1b1e24; --texto: #f3f4f6; --texto-2: #b4bac4; --borde: #343942;
  --acento: #f06a6a; --acento-solido: #b42626; --positivo: #4cc38a; --negativo: #f2777a; --vigente: #4cc38a;
  --vigente-fondo: #12291d; --vencido: #f2777a; --vencido-fondo: #3a1719; --sin-datos: #b4bac4; --sin-datos-fondo: #23262d;
  --futuro: #c3a8f0; --futuro-fondo: #2b2340; --foco: #f3f4f6; color-scheme: dark; } }
:root[data-theme="dark"] {
  --fondo: #090a0c; --superficie: #121419; --elevada: #1b1e24; --texto: #f3f4f6; --texto-2: #b4bac4; --borde: #343942;
  --acento: #f06a6a; --acento-solido: #b42626; --positivo: #4cc38a; --negativo: #f2777a; --vigente: #4cc38a;
  --vigente-fondo: #12291d; --vencido: #f2777a; --vencido-fondo: #3a1719; --sin-datos: #b4bac4; --sin-datos-fondo: #23262d;
  --futuro: #c3a8f0; --futuro-fondo: #2b2340; --foco: #f3f4f6; color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--fondo); color: var(--texto); font: 14px/1.45 var(--sans); font-variant-numeric: tabular-nums;
  padding-block: 12px 24px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-size: 1.15rem; margin: 0; font-weight: 650; letter-spacing: .01em; }
.cabeza { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 8px; }
.cabeza p { margin: 0; color: var(--texto-2); font-size: .82rem; }
.franja { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; flex-wrap: wrap; gap: 2px 16px;
  padding: 6px 10px; background: var(--elevada); border: 1px solid var(--borde); border-radius: 4px; font-size: .78rem; color: var(--texto-2); margin-bottom: 8px; }
.franja b { color: var(--texto); font-weight: 650; }
.cuerpo { display: grid; grid-template-columns: minmax(250px, 23%) minmax(0, 1fr) minmax(280px, 27%); gap: 8px; align-items: start; }
.panel { background: var(--superficie); border: 1px solid var(--borde); border-radius: 4px; padding: 8px; min-width: 0; }
.controles { display: grid; gap: 6px; margin-bottom: 6px; }
input, select, button { font: inherit; color: var(--texto); }
input, select { background: var(--fondo); border: 1px solid var(--borde); border-radius: 4px; padding: 7px 8px; min-height: 36px; width: 100%; }
:focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }
.ayuda { color: var(--texto-2); font-size: .76rem; margin: 0 0 6px; }
.tabla { max-height: 560px; overflow: auto; }
table { border-collapse: collapse; width: 100%; font-size: .82rem; }
caption { text-align: left; color: var(--texto-2); font-size: .74rem; padding: 2px 0 6px; }
th, td { padding: 0 6px; height: 28px; border-bottom: 1px solid var(--borde); white-space: nowrap; text-align: left; }
th { position: sticky; top: 0; background: var(--elevada); z-index: 1; }
th button { background: none; border: none; font-weight: 650; cursor: pointer; padding: 4px 0; font-size: .74rem; text-transform: uppercase; letter-spacing: .04em; }
.num { text-align: right; }
.sim { font-family: var(--simbolo); }
.u { color: var(--texto-2); font-size: .7rem; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: var(--elevada); }
tr.sel { background: var(--elevada); box-shadow: inset 3px 0 0 var(--acento); font-weight: 650; }
.pos { color: var(--positivo); } .neg { color: var(--negativo); }
.chip { display: inline-block; font-size: .7rem; font-weight: 600; border-radius: 999px; padding: 1px 8px; }
.c-vigente { background: var(--vigente-fondo); color: var(--vigente); }
.c-vencido { background: var(--vencido-fondo); color: var(--vencido); }
.c-sin { background: var(--sin-datos-fondo); color: var(--sin-datos); }
.titulo h2 { margin: 0; font-size: 1rem; }
.titulo p { margin: 2px 0 6px; color: var(--texto-2); font-size: .8rem; }
.seg { display: inline-flex; border: 1px solid var(--borde); border-radius: 4px; overflow: hidden; margin-bottom: 6px; }
.seg button { background: var(--superficie); border: none; padding: 6px 12px; cursor: pointer; color: var(--texto-2); min-height: 34px; }
.seg button[aria-checked="true"] { background: var(--acento-solido); color: var(--acento-texto); font-weight: 650; }
svg { width: 100%; height: auto; display: block; }
svg text { fill: var(--texto-2); font-size: 11px; font-family: var(--sans); }
.leyenda { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: .76rem; color: var(--texto-2); }
.leyenda i { display: inline-block; width: 14px; height: 3px; vertical-align: middle; margin-right: 5px; }
.insp { display: grid; gap: 8px; }
.bloque { border: 1px solid var(--borde); border-radius: 4px; padding: 8px 10px; }
.bloque h3 { margin: 0 0 6px; font-size: .72rem; text-transform: uppercase; letter-spacing: .05em; color: var(--texto-2); }
.obs { border-left: 3px solid var(--vigente); }
.ref { border-left: 3px solid var(--texto-2); }
.fut { border: 1px dashed var(--futuro); }
.fut h3 { color: var(--futuro); }
dl { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 10px; margin: 0; font-size: .82rem; }
dt { color: var(--texto-2); } dd { margin: 0; text-align: right; overflow-wrap: break-word; }
.precio { font-size: 1.45rem; font-weight: 650; margin: 0 0 4px; }
.nota { color: var(--texto-2); font-size: .76rem; margin: 6px 0 0; }
.vacio { color: var(--texto-2); padding: 24px 8px; }
.movil { display: none; }
@media (max-width: 1100px) { .cuerpo { grid-template-columns: minmax(230px, 32%) minmax(0, 1fr); } .insp { grid-column: 1 / -1; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); } }
@media (max-width: 720px) {
  .movil { display: flex; border: 1px solid var(--borde); border-radius: 4px; overflow: hidden; margin-bottom: 8px; }
  .movil button { flex: 1; background: var(--superficie); border: none; padding: 10px; min-height: 44px; color: var(--texto-2); }
  .movil button[aria-selected="true"] { background: var(--acento-solido); color: var(--acento-texto); font-weight: 650; }
  .cuerpo { display: block; }
  th, td { padding-inline: 4px; }
  [data-vista="monitor"] .p-graf, [data-vista="monitor"] .insp, [data-vista="grafico"] .p-mon, [data-vista="grafico"] .insp,
  [data-vista="detalle"] .p-mon, [data-vista="detalle"] .p-graf { display: none; }
  .insp { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
</style>
</head>

<div class="cabeza">
  <h1>Help Quote Terminal</h1>
  <p id="sello">DATOS SIMULADOS (demostración) · Estación de Mercado. Para datos reales: Codespaces o su PC</p>

  </section>
  <section class="panel p-graf" id="grafico" aria-label="Gráfico principal" aria-live="polite"></section>
  <aside class="insp" id="insp" aria-label="Inspector del instrumento"></aside>
</main>

      el("td", { class: "num", title: c.moneda !== "MXN" ? "Precio de la bolsa de origen, no la cotización del SIC" : null }, n2(c.cierre), el("span", { class: "u", texto: ` ${c.moneda}` })),
      el("td", { class: `num ${cero ? "" : c.variacion > 0 ? "pos" : "neg"}`, texto: c.variacion == null ? "—" : cero ? "0.0 %" : `${c.variacion > 0 ? "▲" : "▼"} ${pc(c.variacion)}` }),
      el("td", {}, el("span", { class: `chip ${cl}`, texto: tx })));
  }));
  $("tabla").replaceChildren(el("table", { "aria-label": "Monitor de instrumentos" },
    el("caption", { texto: `${r.length} instrumentos · último cierre en su moneda (USD = bolsa de origen) · ◆ con gráfico` }),
    el("thead", {}, el("tr", {}, cab("clave", "Símbolo"), cab("cierre", "Último", true), cab("variacion", "Var. 1 día", true), cab("fecha", "Dato"))), cuerpo));
}

function grafica(s, pr) {
  const serie = s.serie.slice(-st.n);
  if (serie.length < 2) return el("p", { class: "vacio", texto: "Sin historia suficiente en esta foto." });
  const W = 760, H = 300, m = { i: 64, d: 16, s: 14, f: 30 };
  const proy = pr ? [{ x: pr.fecha_base, b: pr.precio_base, lo: pr.precio_base, hi: pr.precio_base },
    { x: pr.fecha_objetivo, b: pr.precio_base * (1 + pr.prediccion), lo: pr.precio_base * (1 + pr.p10), hi: pr.precio_base * (1 + pr.p90) }] : [];
  const xs = [...new Set([...serie.map((p) => p.fecha), ...proy.map((p) => p.x)])].sort();
  const ix = new Map(xs.map((x, i) => [x, i]));
  const ys = [...serie.map((p) => p.cierre), ...proy.flatMap((p) => [p.lo, p.hi])];
  let lo = Math.min(...ys), hi = Math.max(...ys); if (lo === hi) { lo -= 1; hi += 1; }
  const X = (x) => m.i + (ix.get(x) / Math.max(xs.length - 1, 1)) * (W - m.i - m.d);
  const Y = (y) => m.s + (1 - (y - lo) / (hi - lo)) * (H - m.s - m.f);
  const g = sv("svg", { viewBox: `0 0 ${W} ${H}`, role: "img", "aria-label": `${s.clave}: cierres en MXN del ${serie[0].fecha} al ${serie[serie.length - 1].fecha}${pr ? `; proyección 10–90 % al ${pr.fecha_objetivo}` : ""}` });
  for (let k = 0; k <= 4; k++) { const y = lo + ((hi - lo) * k) / 4;
    g.append(sv("line", { x1: m.i, x2: W - m.d, y1: Y(y), y2: Y(y), stroke: "var(--borde)", "stroke-width": 1 }));
    g.append(sv("text", { x: m.i - 6, y: Y(y) + 4, "text-anchor": "end" }, n2(y))); }
  [xs[0], xs[Math.floor(xs.length / 2)], xs[xs.length - 1]].forEach((x, j) => g.append(sv("text", { x: X(x), y: H - 8, "text-anchor": ["start", "middle", "end"][j] }, x)));
  g.append(sv("path", { d: serie.map((p, i) => `${i ? "L" : "M"}${X(p.fecha).toFixed(1)},${Y(p.cierre).toFixed(1)}`).join(""), fill: "none", stroke: "var(--texto)", "stroke-width": 1.6 }));
  if (pr) {
    const L = X(pr.fecha_base);
    g.append(sv("line", { x1: L, x2: L, y1: m.s, y2: H - m.f, stroke: "var(--texto-2)", "stroke-dasharray": "3 3" }));
    g.append(sv("text", { x: L - 4, y: m.s + 10, "text-anchor": "end" }, `proyección del cierre ${pr.fecha_base} →`));
    g.append(sv("path", { d: `M${X(proy[0].x)},${Y(proy[0].hi)} L${X(proy[1].x)},${Y(proy[1].hi)} L${X(proy[1].x)},${Y(proy[1].lo)} L${X(proy[0].x)},${Y(proy[0].lo)} Z`, fill: "var(--futuro-fondo)", stroke: "var(--futuro)", "stroke-dasharray": "4 3" }));
    g.append(sv("path", { d: `M${X(proy[0].x)},${Y(proy[0].b)} L${X(proy[1].x)},${Y(proy[1].b)}`, fill: "none", stroke: "var(--futuro)", "stroke-width": 1.6, "stroke-dasharray": "5 4" }));
  }
  const i1 = el("i"); i1.style.background = "var(--texto)"; const i2 = el("i"); i2.style.background = "var(--futuro)";
  return el("figure", { style: "margin:0" }, g, el("figcaption", { class: "leyenda" }, el("span", {}, i1, "Histórico: cierres diarios (MXN)"),
    pr ? el("span", {}, i2, `Proyección: rango 10–90 % y mediana, ${pr.horizonte} sesión(es)`) : el("span", { texto: "Sin proyección vigente" })));
}

function pron(id) {
  return D.pronosticos.filter((p) => p.instrumento_id === id && p.p10 != null).sort((a, b) => (b.fecha_objetivo > a.fecha_objetivo ? 1 : -1) || b.horizonte - a.horizonte)[0] || null;
}

function detalle() {
  const c = D.celdas.find((x) => x.id === st.sel), s = D.series[st.sel], pr = s ? pron(st.sel) : null;
  franja();
  if (!c) { $("grafico").replaceChildren(el("p", { class: "vacio", texto: "Elija un instrumento en el monitor." })); $("insp").replaceChildren(); return; }
  const fila = (a, b) => [el("dt", { texto: a }), el("dd", { texto: b ?? "—" })];
  if (!s) {
    $("grafico").replaceChildren(el("div", { class: "titulo" }, el("h2", {}, el("span", { class: "sim", texto: c.clave.replace(" *", "") }), ` ${c.nombre || ""}`)),
      el("p", { class: "vacio", texto: "Esta foto solo incluye la serie histórica de 36 instrumentos (◆). Su último cierre está en el monitor y en el inspector." }));
    $("insp").replaceChildren(el("section", { class: "bloque obs" }, el("h3", { texto: "Último cierre simulado" }),
      el("p", { class: "precio" }, n2(c.cierre), el("span", { class: "u", texto: ` ${c.moneda}` })),
      el("span", { class: "chip c-sin", texto: "DATOS SIMULADOS" }),
      el("dl", {}, fila("Fecha", c.fecha), fila("Fuente", c.proveedor), fila("Var. 1 día", pc(c.variacion)), fila("Mercado", c.mercado))));
    return;
  }
  const p = s.precio, v = s.variacion || {};
  const seg = el("div", { class: "seg", role: "radiogroup", "aria-label": "Intervalo" }, [[21, "1M"], [63, "3M"], [126, "6M"], [252, "1A"]].map(([n, t]) =>
    el("button", { type: "button", role: "radio", "aria-checked": String(st.n === n), texto: t, onclick: () => { st.n = n; detalle(); } })));
  $("grafico").replaceChildren(el("div", { class: "titulo" }, el("h2", {}, el("span", { class: "sim", texto: s.clave.replace(" *", "") }), ` ${s.nombre}`),
    el("p", { texto: `Cierres diarios simulados en MXN · ${s.perfil.mercado || ""}` }), seg), grafica(s, pr));
  const ref = p.precio_origen && p.moneda_origen && p.moneda_origen !== "MXN";
  $("insp").replaceChildren(
    el("section", { class: "bloque obs", "aria-label": "Cotización simulada" }, el("h3", { texto: "Cotización simulada" }),
      el("p", { class: "precio" }, n2(p.precio_mxn), el("span", { class: "u", texto: " MXN" })),
      el("span", { class: "chip c-sin", texto: "DATOS SIMULADOS" }),
      el("dl", { style: "margin-top:6px" }, fila("Fuente", p.proveedor), fila("Fecha del dato", `${p.fecha} (cierre)`), fila("Var. 1 día", pc(v["1d"])),
        fila("Var. 1 mes", pc(v["1m"])), fila("Var. 1 año", pc(v["1a"])), fila("Rango 52 semanas", `${n2(s.min52)} – ${n2(s.max52)} MXN`))),
    el("section", { class: "bloque ref", "aria-label": "Referencia de origen" }, el("h3", { texto: "Referencia de origen" }),
      ref ? el("dl", {}, fila("Bolsa de origen", `${s.perfil.listado || ""} · ${s.perfil.bolsa_origen || ""}`), fila("Precio de origen", `${n2(p.precio_origen)} ${p.moneda_origen} (estimado)`),
        fila("Tipo de cambio", `${n2(D.fx.valor)} USD/MXN · ${D.fx.fecha}`)) : el("p", { class: "nota", texto: "Cotiza en MXN en la BMV: sin referencia de otra bolsa." }),
      ref ? el("p", { class: "nota", texto: "Referencia = precio de origen × tipo de cambio; no es la cotización ejecutable del SIC." }) : null),
    el("section", { class: "bloque fut", "aria-label": "Futuro, estimaciones" }, el("h3", { texto: "Futuro · estimaciones" }),
      pr ? el("dl", {}, fila("Horizonte", `${pr.horizonte} ses. · al ${pr.fecha_objetivo}`), fila("Rango 10–90 %", `${n2(pr.precio_base * (1 + pr.p10))} – ${n2(pr.precio_base * (1 + pr.p90))} MXN`),
        fila("Var. 10 / 50 / 90 %", `${pc(pr.p10)} / ${pc(pr.prediccion)} / ${pc(pr.p90)}`), fila("Prob. de subir", pc(pr.prob_subida).replace("+", "")), fila("Modelo · base", `${pr.modelo} · ${pr.fecha_base}`))
        : el("p", { class: "nota", texto: "Sin pronóstico vigente para este instrumento." }),
      el("p", { class: "nota", texto: "Señal experimental sin ventaja demostrada. No es cotización ni recomendación." })));
}

function elegir(id, foco) {
  st.sel = id;
  document.querySelectorAll("#tabla tr[data-id]").forEach((tr) => { const s = tr.dataset.id === id; tr.classList.toggle("sel", s); tr.setAttribute("aria-selected", String(s)); if (s && foco) { tr.focus(); tr.scrollIntoView({ block: "nearest" }); } });
  if (matchMedia("(max-width: 720px)").matches && !foco) vista("grafico");
  detalle();
}
function vista(v) { $("cuerpo").dataset.vista = v; document.querySelectorAll("#movil button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.v === v))); }

$("buscar").addEventListener("input", (e) => { st.q = e.target.value; monitor(); });
$("buscar").addEventListener("keydown", (e) => {
  if (e.key === "Escape") { e.target.value = ""; st.q = ""; monitor(); e.target.blur(); }
  if (e.key === "Enter" || e.key === "ArrowDown") { e.preventDefault(); const f = filas()[0]; if (f) elegir(f.id, true); }
});
$("universo").addEventListener("change", (e) => { st.uni = e.target.value; monitor(); });
document.querySelectorAll("#movil button").forEach((b) => b.addEventListener("click", () => vista(b.dataset.v)));
document.addEventListener("keydown", (e) => {
  const enCampo = /^(INPUT|SELECT)$/.test(document.activeElement?.tagName || "");
  if (e.key === "/" && !enCampo) { e.preventDefault(); $("buscar").focus(); return; }
  const tr = document.activeElement?.closest?.("#tabla tr[data-id]");
  if (!tr) return;
  if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); const s = e.key === "ArrowDown" ? tr.nextElementSibling : tr.previousElementSibling; if (s) elegir(s.dataset.id, true); }
  if (e.key === "Escape") $("buscar").focus();
});
st.sel = D.series["SIC:XOM"] ? "SIC:XOM" : Object.keys(D.series)[0];
monitor(); detalle();
</script>
</body>
