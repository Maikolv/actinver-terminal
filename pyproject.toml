[project]
name = "actinver-terminal"
version = "0.1.0"
description = "Terminal local de análisis de portafolios (informativa, sin órdenes reales)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "exchange-calendars>=4.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "pypdf>=6.19.0",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0.3",
    "skfolio>=1.3",
    "uvicorn>=0.30",
    "websockets>=13",
    "winrt-runtime>=2 ; sys_platform == 'win32'",
    "winrt-windows-foundation>=2 ; sys_platform == 'win32'",
    "winrt-windows-foundation-collections>=2 ; sys_platform == 'win32'",
    "winrt-windows-globalization>=2 ; sys_platform == 'win32'",
    "winrt-windows-graphics-imaging>=2 ; sys_platform == 'win32'",
    "winrt-windows-media-ocr>=2 ; sys_platform == 'win32'",
    "winrt-windows-storage-streams>=2 ; sys_platform == 'win32'",
    "xlrd>=2.0.2",
]

[project.scripts]
terminal = "terminal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terminal"]

[dependency-groups]
# Candidato experimental Kronos (shiyu-coder/Kronos). Opcional: uv sync --group kronos (torch CPU, varios cientos de MB).
kronos = [
    "torch>=2.0",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "safetensors==0.6.2",
    "tqdm>=4.66",
]
dev = [
    "detect-secrets>=1.5.0",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
