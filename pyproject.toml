[project]
name = "terminal-portafolios"
version = "0.1.0"
description = "Terminal local de análisis de portafolios (informativa, sin órdenes reales)"
requires-python = ">=3.12"
dependencies = [
    "exchange-calendars>=4.5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "numpy>=1.26",
    "pandas>=2.2",
    "python-multipart>=0.0.9",
    "skfolio>=1.3",
    "uvicorn>=0.30",
    "xlrd>=2.0.2",
]

[project.scripts]
terminal = "terminal.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["terminal"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
